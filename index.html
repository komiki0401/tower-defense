<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#151e29"><title>EMBERLINE — 薄明の防衛線</title><link rel="stylesheet" href="./src/style.css"></head>
<body>
<main>
  <header><a class="brand" href="./"><span class="emblem">✦</span> EMBERLINE <small>薄明の防衛線</small></a><div class="header-right"><span class="tag">01 / GRASSLAND</span><button id="pause" class="small-button">一時停止</button></div></header>
  <section class="intro"><div><div class="eyebrow">STAGE 01 — THE FIRST LIGHT</div><h1>薄明の草原</h1><p>灯を守れ。夜明けまで、前へ。</p></div><div class="wallet"><span>出撃資金</span><strong><i>◆</i> <span id="money">180</span><small> / 999</small></strong><span>+22 / 秒</span></div></section>
  <section class="battlefield" aria-label="戦場"><div class="battle-top"><div class="castle-status"><span>✦ 灯火の城 <b id="ally-hp"></b></span><meter id="ally-meter" min="0" max="1100" value="1100"></meter></div><span class="clock" id="clock">00:00</span><div class="castle-status enemy"><span>宵影の城 ◆ <b id="enemy-hp"></b></span><meter id="enemy-meter" min="0" max="1100" value="1100"></meter></div></div><canvas id="game" aria-label="左右にドラッグして戦場を見渡せます"></canvas><div class="field-caption"><span>← ドラッグして戦場を移動 →</span><span id="enemy-count">敵の接近に備えよう</span></div><div id="overlay" hidden><div class="result-card"><div id="result-label" class="eyebrow"></div><h2 id="result-title"></h2><p id="result-text"></p><button id="resume">戦闘を続ける</button><button id="restart">もう一度挑戦</button></div></div></section>
  <section class="deployment"><div class="deploy-heading"><h2>ユニット出撃 <span>DEPLOY UNITS</span></h2><span>クリック / タップ <span class="desktop-hint">・ キー 1 – 3</span></span></div><div id="unit-buttons" class="unit-buttons"></div><div class="tips"><span>戦術メモ</span> 守り手で前線を支え、射手を後ろに。資金は時間で回復します。</div></section>
  <footer><span>敵の城を破壊して勝利しよう</span><span>ORIGINAL MINI STRATEGY · v1.0</span></footer>
</main><script type="module" src="./src/main.js"></script>
</body></html>
